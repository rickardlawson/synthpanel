# Navn for personas med innvandrerbakgrunn.
#
# Norske navn trekkes fra SSB (10467: fornavn etter fødselsår, 12891: etternavn),
# vektet etter hvor vanlige de er – slik at en kvinne født i 1965 typisk heter
# Anne, Hilde eller Heidi. SSB publiserer ikke navn etter landbakgrunn, så for
# personas med innvandrerbakgrunn brukes denne kuraterte listen med vanlige navn
# fra opphavslandet. Opphavet følger portrettet, slik at navn og ansikt henger sammen.
#
# f/m: fornavn for kvinner/menn. etternavn_f/_m: der etternavn er kjønnet (f.eks. polsk).

