[project]
name = "synthpanel"
version = "0.1.0"
description = "Syntetisk panel av den norske befolkningen"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthpanel = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
